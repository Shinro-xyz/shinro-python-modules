# MPC regulator for the InvertedPendulum (n_x=2, n_u=1), linearized about
# the inverted equilibrium at dt=0.01. N=20 (0.2s preview) stabilizes.
type = "MPC_LTI"
name = "mpc_inverted_pendulum"
dt = 0.01
horizon = 20
state_cost = [10.0, 10.0]
control_cost = [0.1]
A_dynamics = [[1.0, 0.01], [0.1962, 1.0]]
B_dynamics = [[0.0], [0.4]]

[constraints]
# F = [I(n_u); -I(n_u)] on the control sequence — explicit because the
# from_config fallback builds I(n_x), which is wrong when n_x != n_u.
matrix = [[1.0], [-1.0]]
# F = [I; -I] -> 2*n_u rows, so upper/lower must have length 2*n_u.
upper = [10.0, 10.0]
lower = [-10.0, -10.0]

# MPPI base tracking: full closed-loop Trajectory -> MPPI -> Kalman -> HolonomicMobileRobot -> MuJoCo.
# MPPI's dynamics/cost are wired from the plant's model via BatchedDynamicsAdapter in ScenarioFactory.build().
[scenario]
name = "mppi_base_tracking"
description = "MPPI + Kalman filter track a straight-line waypoint schedule on the holonomic base"
duration = 16.0
dt = 0.02
tolerance = { steady_state = 0.08, estimator = 0.03 }
input_limits = { min = [-0.5, -0.5, -1.0], max = [0.5, 0.5, 1.0] }

[physics]
free_joint = true

[plant]
name = "base"

[controller]
type = "MPPI"
config = "configs/controllers/mppi_base.toml"

[estimator]
type = "KalmanFilter"
config = "configs/estimators/kalman_base.toml"

[trajectory]
type = "waypoints"
config = "configs/trajectories/base_straight.toml"

[sim]
config = "robot_config.toml"

[noise.measurement]
std = [0.01, 0.01, 0.02]

# EKF + LQR closed loop on InvertedPendulum with a NONLINEAR measurement model:
# the plant's bob position h(x) = [l sin θ, l cos θ] (n_y = 2). The EKF declares
# no `measurement_matrix`, so attach_plant derives h from the plant and it lowers
# into the graph — the live and compiled filters share one sensor model.
[scenario]
name = "ekf_inverted_pendulum_tip_compile"
description = "EKF (nonlinear bob-position h) + LQR on InvertedPendulum"
input_limits = { min = [-5.0], max = [5.0] }

[plant]
type = "InvertedPendulum"
config = "samples/plants/inverted_pendulum.toml"

[controller]
type = "LQR"
config = "samples/controllers/lqr_inverted_pendulum.toml"

[estimator]
type = "ExtendedKalmanFilter"
config = "samples/estimators/ekf_inverted_pendulum_tip.toml"

[compile]
optimize = "debug"        # "debug" | "release" (release -> ReleaseFast)
artifact_name = "libbase"   # kernel installs as lib/<name>.so
# The measurement Jacobian is a finite difference (like the process Jacobian):
# the 1/(2*eps) = 5e5 division amplifies the last-ulp difference between the
# VM's transcendentals and numpy's, tighter than the non-QP 1e-12 gate holds.
oracle_tol = 1e-9
# n_x = 2, n_u = 1 are derived from the [plant] section.

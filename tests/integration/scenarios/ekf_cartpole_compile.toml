# EKF + LQR closed loop on CartPole — the first compiled extended-Kalman graph.
#
# The plant is authoritative: it supplies n_x/n_u, the LQR's linearized model,
# and the EKF's process model (attach_plant -> plant.dynamics, traced through the
# trace backend). The EKF's Jacobians are lowered as a batched finite-difference
# probe of that subgraph (no jacobian op, no kernel).
[scenario]
name = "ekf_cartpole_compile"
description = "EKF + LQR closed loop on CartPole (batched FD process Jacobian)"
input_limits = { min = [-10.0], max = [10.0] }

[plant]
type = "CartPole"
config = "samples/plants/cartpole.toml"

[controller]
type = "LQR"
config = "samples/controllers/lqr_cartpole.toml"

[estimator]
type = "ExtendedKalmanFilter"
config = "samples/estimators/ekf_cartpole.toml"

[compile]
optimize = "debug"        # "debug" | "release" (release -> ReleaseFast)
artifact_name = "libbase"   # kernel installs as lib/<name>.so
# The process Jacobian is a finite difference: the 1/(2*eps) = 5e5 division
# amplifies the last-ulp difference between the VM's transcendentals and
# numpy's, so the non-QP 1e-12 gate is tighter than FD can hold. Measured ~2.5e-11.
oracle_tol = 1e-9
# n_x = 4, n_u = 1 are derived from the [plant] section.

# EKF + LQR closed loop on InvertedPendulum — a nonlinear plant with a PARTIAL
# measurement (theta only, n_y = 1 < n_x = 2), the classic nonlinear EKF case.
#
# The plant is authoritative: it supplies n_x/n_u, the LQR's linearized model, and
# the EKF's nonlinear process model (attach_plant -> plant.dynamics). The EKF's
# process Jacobian lowers as one batched finite-difference probe of that subgraph.
[scenario]
name = "ekf_inverted_pendulum_compile"
description = "EKF (partial theta measurement) + LQR on InvertedPendulum"
input_limits = { min = [-5.0], max = [5.0] }

[plant]
type = "InvertedPendulum"
config = "samples/plants/inverted_pendulum.toml"

[controller]
type = "LQR"
config = "samples/controllers/lqr_inverted_pendulum.toml"

[estimator]
type = "ExtendedKalmanFilter"
config = "samples/estimators/ekf_inverted_pendulum.toml"

[compile]
optimize = "debug"        # "debug" | "release" (release -> ReleaseFast)
artifact_name = "libbase"   # kernel installs as lib/<name>.so
# The process Jacobian is a finite difference: the 1/(2*eps) = 5e5 division amplifies
# the last-ulp difference between the VM's transcendentals and numpy's, so the non-QP
# 1e-12 gate is tighter than FD can hold. Measured ~1e-11.
oracle_tol = 1e-9
# n_x = 2, n_u = 1 are derived from the [plant] section.

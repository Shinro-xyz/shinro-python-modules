# Cartpole balance: plant-only closed loop Trajectory -> LQR -> Kalman -> CartPole.
# No [sim] section: the plant self-integrates its analytical dynamics.
[scenario]
name = "cartpole_balance"
description = "LQR + Kalman regulate a cartpole from a 0.2 rad pole tilt to upright"
duration = 12.0
dt = 0.01
tolerance = { steady_state = 0.05, estimator = 0.03 }
input_limits = { min = [-10.0], max = [10.0] }

[plant]
type = "CartPole"
config = "configs/plants/cartpole.toml"
initial_state = [0.0, 0.0, 0.2, 0.0]

[controller]
type = "LQR"
config = "tests/fixtures/configs/controllers/lqr_cartpole.toml"

[estimator]
type = "KalmanFilter"
config = "tests/fixtures/configs/estimators/kalman_cartpole.toml"

[trajectory]
type = "waypoints"
config = "tests/fixtures/configs/trajectories/cartpole_upright.toml"

[noise.measurement]
std = [0.005, 0.01, 0.005, 0.02]

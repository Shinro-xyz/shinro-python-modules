# SMC + Kalman filter on InvertedPendulum — the SMC model gap closed.
#
# The controller takes its model as inputs (f_x, g_x). There is no host port for
# them: the [plant] is attached, compose bakes f(x) = dynamics(x, 0) and
# g(x) = control_matrix(x, 0) into the graph, and the kernel's inputs stay the
# usual y / x_ref / u_prev plus the estimator's state ports. `g` is derived by
# finite differences of the plant's dynamics (the default control_matrix), which
# is bit-identical to what a host evaluates today via linearize_plant.
[scenario]
name = "smc_pendulum_compile"
description = "SMC (plant-derived model) + Kalman filter on InvertedPendulum"
input_limits = { min = [-5.0], max = [5.0] }

[plant]
type = "InvertedPendulum"
config = "samples/plants/inverted_pendulum.toml"

[controller]
type = "SMC"
config = "samples/controllers/smc_inverted_pendulum.toml"

[estimator]
type = "KalmanFilter"
config = "samples/estimators/kalman_inverted_pendulum.toml"

[compile]
optimize = "debug"        # "debug" | "release" (release -> ReleaseFast)
artifact_name = "libbase"   # kernel installs as lib/<name>.so
# g is a finite difference (control_matrix's default), so the 1/(2*eps) division
# amplifies last-ulp differences between the VM's transcendentals and numpy's,
# exactly as in the EKF scenarios: the non-QP 1e-12 gate is tighter than FD holds.
oracle_tol = 1e-9
# n_x = 2, n_u = 1 are derived from the [plant] section.

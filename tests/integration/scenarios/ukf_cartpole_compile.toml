# UKF + LQR closed loop on CartPole — the compiled unscented-Kalman graph.
#
# The plant is authoritative: it supplies n_x/n_u and the LQR's linearized model,
# and the UKF's process model (attach_plant -> plant.dynamics), traced as ONE
# batched (2n+1, n_x) sigma-point call. The sigma points are rebuilt with the
# cholesky VM op; the estimate carries no finite-difference division (unlike the
# EKF), so the non-QP 1e-12 oracle gate is expected to hold.
[scenario]
name = "ukf_cartpole_compile"
description = "UKF + LQR closed loop on CartPole (batched sigma points, cholesky op)"
input_limits = { min = [-10.0], max = [10.0] }

[plant]
type = "CartPole"
config = "samples/plants/cartpole.toml"

[controller]
type = "LQR"
config = "samples/controllers/lqr_cartpole.toml"

[estimator]
type = "UnscentedKF"
config = "samples/estimators/ukf_cartpole.toml"

[compile]
optimize = "debug"        # "debug" | "release" (release -> ReleaseFast)
artifact_name = "libbase"   # kernel installs as lib/<name>.so
# n_x = 4, n_u = 1 are derived from the [plant] section.

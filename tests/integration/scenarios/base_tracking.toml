# Base tracking: the canonical compiled closed-loop step graph (KF + LQR on the
# 3-DOF holonomic base). The codegen/compilation tests and the shipped graph
# (shinro.codegen.recipes.LQR_CONFIGS) are pinned to this scenario, so keep its
# controller/estimator/input_limits consistent with those recipes.
#
# Compile-only: there is no [sim]/[plant] here — the dims are declared in
# [compile] and baked into the graph at trace time.
[scenario]
name = "base_tracking"
description = "KF + LQR closed loop on the 3-DOF holonomic base (compile reference)"
input_limits = { min = [-0.5, -0.5, -1.0], max = [0.5, 0.5, 1.0] }

[controller]
type = "LQR"
config = "samples/controllers/lqr_base.toml"

[estimator]
type = "KalmanFilter"
config = "samples/estimators/kalman_base.toml"

[compile]
optimize = "debug"        # "debug" | "release" (release -> ReleaseFast)
artifact_name = "libbase"   # kernel installs as lib/<name>.so
n_x = 3
n_u = 3

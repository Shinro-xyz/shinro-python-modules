# CartPole + LQR + KalmanFilter, with the model DERIVED from the plant.
#
# The [plant] section is the source of truth: gen_scenario derives n_x/n_u and
# the A_dynamics/B_dynamics model from it (linearize at upright + Euler at the
# plant's dt), so the controller/estimator configs below need only specs +
# weights — no hand-computed model. This is the same derivation the simulation
# path (ScenarioFactory) uses, so sim and compile agree on the model.
#
# Neither [compile] n_x/n_u nor config A_dynamics/B_dynamics is written: the
# plant is authoritative and derives both. A declared n_x/n_u that disagrees
# with the plant is now an error (the plant wins).

[plant]
type = "CartPole"
config = "samples/plants/cartpole.toml"

[controller]
type = "LQR"
config = "tests/fixtures/configs/controllers/lqr_cartpole.toml"

[estimator]
type = "KalmanFilter"
config = "tests/fixtures/configs/estimators/kalman_cartpole.toml"

[scenario]
name = "cartpole_lqr_kf_derived"
input_limits = { min = [-10.0], max = [10.0] }

[compile]
optimize = "release"

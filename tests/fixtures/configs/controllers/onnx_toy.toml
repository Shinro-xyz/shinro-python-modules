# Toy ONNX MLP policy fixture (3 -> 4 -> 2 tanh), used by the ONNX importer /
# adapter unit tests and the policy-only compile scenario.
#
# The .onnx is generated by scripts/gen_toy_onnx.py; model_path is CWD-relative,
# so run from the repo root.
type = "onnx_rl"
name = "toy_mlp"
model_path = "tests/fixtures/models/toy_mlp.onnx"
action_space = "continuous"
seed = 0

[observation]
state_keys = [0, 1, 2]

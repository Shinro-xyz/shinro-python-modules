# Toy ONNX recurrent policy fixture (one LSTM step, H=4), used by the recurrent
# importer/adapter tests and the policy-only compile scenario.
#
# The .onnx is generated by scripts/gen_toy_recurrent_onnx.py; model_path is
# CWD-relative, so run from the repo root. The graph exposes the cell state as
# ports: the kernel takes state_h_0 / state_c_0 and publishes state_hc_0
# ([h ‖ c]) for the host to feed back next tick.
type = "onnx_rl"
name = "toy_lstm"
model_path = "tests/fixtures/models/toy_lstm.onnx"
action_space = "continuous"
seed = 0

[observation]
state_keys = [0, 1, 2]

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: pip install build setuptools setuptools-scm[toml]
      - name: Build wheel + sdist
        run: python -m build
      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import sys; sys.path.insert(0, '.'); from shinro import __version__; print(__version__.split('+')[0])" 2>/dev/null || true)
          echo "tag=$tag version=$version"
          # setuptools-scm should report exactly the tagged version on a clean tag build
          if [ "$version" != "$tag" ]; then
            echo "::warning::setuptools-scm version '$version' does not match tag '$tag' — check for uncommitted changes"
          fi
      - name: Run smoke tests on the built wheel
        run: |
          pip install dist/*.whl
          python -c "import shinro; from shinro.factories import ControllerFactory; print(shinro.__version__)"
          python -c "from shinro.factories import ControllerFactory; ControllerFactory('configs/controllers/lqr_base.toml').create(); print('config ok')"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.whl

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
exclude = [".codebase", "lab-notes", "demos", "deprecated"]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["UP006", "UP007", "E501", "E741"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

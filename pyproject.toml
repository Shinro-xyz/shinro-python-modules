[build-system]
# setuptools>=77 is required for PEP 639 (`license` expression + `license-files`
# under [project]); older versions ignore both fields in build isolation.
requires = ["setuptools>=77", "setuptools-scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shinro"
description = "Whole-body control framework: controllers, plants, estimators, trajectories, and a MuJoCo-backed simulation factory."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
# Outbound license: Apache-2.0 (the LICENSE file at the repo root is the
# Apache License 2.0 text). PEP 639 license expression + license-files, so the
# license and third-party attribution travel into the wheel METADATA as well as
# the sdist. Apache-2.0 §4(b) requires recipients of redistributed OSQP code to
# receive the license text; third-party attribution lives in THIRD-PARTY.md.
# NOTE: do not add `License :: OSI Approved :: ...` classifiers — setuptools
# rejects them when a PEP 639 `license` expression is present.
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD-PARTY.md", "licenses/*"]
authors = [{ name = "Shinro" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "osqp>=1.0",
    "mcp>=1.28,<2",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.0"]
torch = ["torch>=2.0"]
lerobot = ["lerobot>=0.5"]
onnx-rl = ["onnx>=1.16"]
media = ["imageio>=2.30", "Pillow>=10.0", "matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyrefly>=1.3",
    "onnx>=1.16",
    "build>=1.2",
    "setuptools-scm[toml]>=8.0",
    "git-cliff>=2.0",
]

[project.scripts]
shinro = "shinro.cli:main"
shinro-mcp = "shinro.mcp.server:main"
shinro-mcp-codegen = "shinro.mcp.codegen_server:main"
shinro-mcp-notebook = "shinro.mcp.notebook_server:main"
shinro-compile = "shinro.cli.compile:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shinro = ["runtime/**/*"]

[tool.setuptools_scm]
write_to = "src/shinro/_version.py"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
addopts = "-m 'not integration and not mcp'"
markers = [
    "integration: full-loop physics-backed tests (slow, requires MuJoCo; run via `make test-integration`)",
    "mcp: MCP server subprocess protocol tests (spawns a real server; run via `make test-mcp`)",
]

[tool.ruff]
target-version = "py312"
exclude = [".codebase", "lab-notes", "demos", "deprecated", "src/shinro/_version.py", "src/shinro/runtime/codegen/emosqp/setup.py"]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["UP006", "UP007", "E501", "E741"]
"__init__.py" = ["F401"]
"src/shinro/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.pyrefly]
preset = "default"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

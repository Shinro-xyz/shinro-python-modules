# Example MuJoCo sim manifest — a double pendulum driven by the DoublePendulum
# plant. This is an example, not a shipped default: copy it and replace the
# engine/plant entries with your own robot (see samples/README.md).
[engine]
type = "mujoco"
model = "samples/models/double_pendulum.xml"
dt = 0.02

[[plants]]
type = "DoublePendulum"
name = "pendulum"
mass_top = 0.1
mass_bottom = 0.1
length_top = 0.5
length_bottom = 0.5
dt = 0.02
g = 9.81

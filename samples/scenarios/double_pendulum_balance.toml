# DoublePendulum balance — plant-only, no MuJoCo required.
# Copy this file and edit the parameters for your robot.

[scenario]
name = "double_pendulum_balance"
dt = 0.01
duration = 20.0
input_limits = { min = [-5.0, -5.0], max = [5.0, 5.0] }

[plant]
type = "DoublePendulum"
config = "samples/plants/double_pendulum.toml"
initial_state = [0.3, 0.2, 0.0, 0.0]

[controller]
type = "LQR"
config = "samples/controllers/lqr_double_pendulum.toml"

[estimator]
type = "KalmanFilter"
config = "samples/estimators/kalman_double_pendulum.toml"

[trajectory]
type = "waypoints"
config = "samples/trajectories/double_pendulum_upright.toml"

# CartPole balance — plant-only, no MuJoCo required.
# Copy this file and edit the parameters for your robot.

[scenario]
name = "cartpole_balance"
dt = 0.01
duration = 20.0
input_limits = { min = [-10.0], max = [10.0] }

[plant]
type = "CartPole"
config = "samples/plants/cartpole.toml"
initial_state = [0.0, 0.0, 0.2, 0.0]

[controller]
type = "LQR"
config = "samples/controllers/lqr_cartpole.toml"

[estimator]
type = "KalmanFilter"
config = "samples/estimators/kalman_cartpole.toml"

[trajectory]
type = "waypoints"
config = "samples/trajectories/cartpole_upright.toml"

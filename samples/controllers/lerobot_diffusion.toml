# FILE: samples/controllers/lerobot_diffusion.toml
# LeRobot diffusion policy adapter
# Requires: pip install lerobot
#
# Replace `checkpoint` with your own Hugging Face LeRobot policy repo id.

type = "lerobot_diffusion"
name = "lerobot_policy"
policy_type = "diffusion"
checkpoint = "<org>/<policy-checkpoint>"
use_camera = false
device = "cpu"

# Unscented Kalman filter for CartPole (4 states) with a PARTIAL sensor set:
# cart position x and pole angle theta (n_y = 2 < n_x = 4). dt is inherited from
# the plant.
#
# The nonlinear process model is not in the config: the plant is attached at
# build time (attach_plant -> plant.dynamics) and traced through the trace
# backend as ONE batched (2n+1, n_x) sigma-point call (no finite differences,
# unlike the EKF). `measurement_matrix` gives the linear measurement model
# h(x) = C x; its row count sets n_y, which the composed graph carries as the
# width of the `y` port. alpha/beta/kappa are the scaled-UT spread parameters;
# alpha=1 / kappa=0 keeps the weights well conditioned (lambda = 0).
type = "UnscentedKF"
name = "cartpole_ukf"

process_noise = [0.01, 0.01, 0.01, 0.01]
measurement_noise = [0.1, 0.1]

alpha = 1.0
beta = 2.0
kappa = 0.0

measurement_matrix = [
    [1.0, 0.0, 0.0, 0.0],   # cart position x
    [0.0, 0.0, 1.0, 0.0],   # pole angle theta
]

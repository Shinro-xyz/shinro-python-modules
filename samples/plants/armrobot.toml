# FILE: samples/plants/armrobot.toml
# Example config for the ArmRobot plant (a generic 6-DOF serial arm).
#
# This is a RobotSim [[plants]] entry: when consumed by RobotSim the
# `joint_groups` and `engine` keys are injected by the sim factory, so a
# standalone TOML only needs the arm-specific geometry/kinematics fields.
#
# The geometry below is illustrative (synthetic offsets, a placeholder
# end-effector body name); replace it with your own arm's values.
#
# Usage:
#   from shinro.simulation.robotsim import RobotSim
#   sim = RobotSim("samples/plants/armrobot.toml")  # arm + base via robot_config.toml
#   sim.arm.step([dx, dy, dz, droll, dpitch, dyaw])
type = "ArmRobot"
name = "arm"
num_dof = 6
dt = 0.02

# Name of the joint group in the [joint_groups] table (defined in robot_config.toml).
joint_group = "arm_joints"

# End-effector body used for mesh-accurate FK/IK via the physics engine.
ee_body_name = "ee_link"

# Rotation axis of each joint: "x", "y", or "z".
rot_axes = ["y", "z", "z", "x", "z", "z"]

# Per-joint link offset vectors (m) — one per DOF.
joint_offsets = [
  [0.020, 0.030, 0.050],
  [0.000, -0.110, 0.020],
  [0.000, 0.130, 0.030],
  [-0.020, 0.030, -0.060],
  [0.020, 0.030, -0.010],
  [0.000, 0.000, 0.000],
]

# git-cliff changelog configuration.
# See https://git-cliff.org/ for the full reference.
#
# CHANGELOG.md is generated by `git cliff` — do not edit it by hand.
# Configure behavior here instead.

[remote.github]
owner = "Shinro-xyz"
repo = "shinro-python-modules"

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Version numbers are derived from git tags via `setuptools-scm` — a release is
simply a `vX.Y.Z` tag pushed to `origin` (see `make release-patch`, `make
release-minor`, `make release-major` and the README "Releases" section).

This file is auto-generated by [`git cliff`](https://git-cliff.org) from
[Conventional Commits](https://www.conventionalcommits.org/). Do not edit it
by hand — adjust `cliff.toml` instead.

"""
body = """{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}..{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/tree/{{ release.version }}
        {% endif -%}
    {% else -%}
        [Unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = []

[git]
# Parse commits according to the conventional commits specification.
conventional_commits = true
# Exclude commits that do not match the conventional commit specification.
filter_unconventional = true
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers to extract data from the commit message.
# Assigns commits to groups and can skip commits entirely.
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI" },
    { message = "^style", group = "Style" },
    { message = "^chore", skip = true },
    { message = "^revert", group = "Fixed" },
    { message = ".*", group = "Other" },
]
# Prevent breaking commits from being excluded by commit parsers.
protect_breaking_commits = false
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Regex to select git tags that represent releases.
tag_pattern = "v[0-9].*"
# Regex to select git tags that do not represent proper releases.
skip_tags = "beta|alpha"
# Regex to exclude git tags after applying the tag_pattern.
ignore_tags = "rc"
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
sort_commits = "newest"
